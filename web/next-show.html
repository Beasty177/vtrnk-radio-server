<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>VTRNK Radio Schedule</title>
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #eee; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        .logo-header { text-align: center; margin-bottom: 25px; }
        .logo-header .logo { max-width: 180px; height: auto; }

        h1 { background: #2a2a2a; padding: 15px; border-radius: 8px; color: white; text-align: center; }

        .add-btn {
            display: block; width: 100%; max-width: 340px; margin: 0 auto 30px;
            height: 56px; line-height: 56px; background: #007bff; color: white;
            font-size: 1.1em; font-weight: 500; text-align: center;
            border: none; border-radius: 6px; cursor: pointer;
        }
        .add-btn:hover { background: #0056b3; }

        .category-container { margin: 30px 0; }
        .category-header {
            background: #2a2a2a; color: white; padding: 12px 20px;
            border-radius: 8px; cursor: pointer; font-size: 1.3em;
        }
        .category-header:hover { background: #333; }

        .list-container { padding: 0; }

        /* Таблица программ */
        table.program-table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }
        table.program-table th, table.program-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        table.program-table th {
            background: #222;
            font-weight: bold;
            color: #ccc;
        }
        table.program-table tr {
            cursor: pointer;
            transition: background 0.2s;
        }
        table.program-table tr:hover {
            background: #2a2a2a;
        }
        table.program-table tr:last-child td { border-bottom: none; }

        /* Разделитель дня недели (светлее фон) */
        tr.day-separator {
            background: #252525;
            font-weight: bold;
            color: #aaa;
            cursor: pointer; /* ← кликабельно */
        }
        tr.day-separator td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 2px solid #444;
        }

        /* Пустая строка между разделителями */
        tr.empty-row td {
            height: 20px;
            border: none;
        }

        /* Отступ после разделителя до первой программы дня */
        tr.day-separator + tr.program-row td {
            padding-top: 20px;
        }

        /* Пояснение внизу таблицы */
        .schedule-note {
            text-align: center;
            color: #777;
            font-size: 0.85em;
            margin-top: 20px;
            padding: 10px;
        }

        /* Модалка */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            overflow-y: auto; z-index: 1000; padding: 20px 10px;
        }
        .modal-content {
            background: #1a1a1a; margin: auto; padding: 24px; border-radius: 12px;
            width: 92%; max-width: 680px; max-height: 90vh; overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-content h2 { margin-top: 0; }

        .modal-poster-wrapper {
            width: 300px; height: 300px; margin: 0 auto 20px;
            background: #111; border-radius: 10px; overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
        }
        .modal-poster { width: 100%; height: 100%; object-fit: contain; object-position: center; }
        .modal-poster-placeholder {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            color: #555; font-size: 2em; background: linear-gradient(135deg, #222, #333);
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #ddd; }
        input, textarea, select {
            width: 100%; padding: 10px; background: #222; border: 1px solid #444;
            color: white; border-radius: 6px; box-sizing: border-box;
        }
        textarea { min-height: 100px; resize: vertical; }

        .duration-selects { display: flex; gap: 12px; flex-wrap: wrap; }
        .duration-selects select { flex: 1; min-width: 140px; }

        .poster-input-wrapper {
            border: 2px solid #ffffff; border-radius: 8px; padding: 12px; background: #222;
        }

        .poster-controls {
            display: flex; gap: 10px; margin-top: 12px;
        }
        .poster-controls button {
            flex: 1; padding: 10px; font-size: 1em; border: none; border-radius: 6px;
            cursor: pointer; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .poster-upload-btn { background: #007bff; color: white; }
        .poster-upload-btn:hover { background: #0056b3; }
        .poster-delete-btn { background: #dc3545; color: white; }
        .poster-delete-btn:hover { background: #c82333; }

        .modal-actions {
            display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; margin-top: 30px;
        }
        .save-btn, .cancel-btn, .copy-btn, .delete-program-btn {
            padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; font-size: 1em;
        }
        .save-btn { background: #007bff; color: white; }
        .save-btn:hover { background: #0056b3; }
        .cancel-btn { background: #6c757d; color: white; }
        .cancel-btn:hover { background: #5a6268; }
        .copy-btn { background: #6c757d; color: white; }
        .copy-btn:hover { background: #5a6268; }
        .delete-program-btn { background: #dc3545; color: white; }
        .delete-program-btn:hover { background: #c82333; }

        @media (max-width: 768px) {
            .add-btn { width: 100%; min-width: auto; }
            .modal-content { padding: 18px; width: 96%; }
            .modal-actions { flex-direction: column; gap: 10px; }
            table.program-table th, table.program-table td { font-size: 0.9em; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-header">
            <img src="/images/icon.png" alt="VTRNK Logo" class="logo">
        </div>

        <h1>Расписание программ</h1>

        <button class="add-btn" onclick="openAddModal()">+ Добавить программу</button>

        <!-- Актуальное расписание -->
        <div class="category-container">
            <div class="category-header" onclick="toggleCategory('programs')" style="background: #2a2a2a; color: white;">
                <h2>Актуальное расписание (<span id="programsCount">0</span>)</h2>
            </div>
            <div class="list-container category-list" id="programsList" style="display: block;">
                <table class="program-table">
                    <thead>
                        <tr>
                            <th>Название программы</th>
                            <th>Автор</th>
                            <th>Дата и время начала</th>
                        </tr>
                    </thead>
                    <tbody id="programsTableBody"></tbody>
                </table>
                <div class="schedule-note">
                    Дни недели начинаются в 06:00 и заканчиваются в 05:59 следующего дня (по радийному расписанию)
                </div>
            </div>
        </div>

        <!-- Архив -->
        <div class="category-container">
            <div class="category-header" onclick="toggleCategory('archive')" style="background: #2a2a2a; color: white;">
                <h2>Архив</h2>
            </div>
            <div class="list-container category-list" id="archiveList" style="display: none;">
                <table class="program-table">
                    <thead>
                        <tr>
                            <th>Название программы</th>
                            <th>Автор</th>
                            <th>Дата и время начала</th>
                        </tr>
                    </thead>
                    <tbody id="archiveTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модалка -->
    <div class="modal" id="programModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <h2 id="modalTitle">Добавить программу</h2>

            <div class="modal-poster-wrapper">
                <img id="modalPoster" class="modal-poster" src="" style="display:none;" alt="Афиша программы">
                <div id="modalPosterPlaceholder" class="modal-poster-placeholder">Нет афиши</div>
            </div>

            <form id="programForm">
                <div class="form-group">
                    <label>Название события</label>
                    <input type="text" id="eventName" required placeholder="Например: Ночной джангл" maxlength="200">
                </div>

                <div class="form-group">
                    <label>Дата и время начала</label>
                    <input type="datetime-local" id="startDateTime" required>
                </div>

                <div class="form-group">
                    <label>Продолжительность</label>
                    <div class="duration-selects">
                        <select id="durationHours">
                            <option value="0">0 часов</option>
                            <option value="1" selected>1 час</option>
                            <script>
                                for(let h=2; h<=23; h++) document.write(`<option value="${h}">${h} час(ов)</option>`);
                            </script>
                        </select>
                        <select id="durationMinutes">
                            <option value="0">00 мин</option>
                            <option value="10">10 мин</option>
                            <option value="20">20 мин</option>
                            <option value="30">30 мин</option>
                            <option value="40">40 мин</option>
                            <option value="50">50 мин</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Вид программы</label>
                    <select id="programType" onchange="toggleCustomType()">
                        <option value="podcast">Подкаст</option>
                        <option value="live">Прямой эфир</option>
                        <option value="repeat">Повтор</option>
                        <option value="guest_mix">Guest Mix</option>
                        <option value="custom">Свой вариант</option>
                    </select>
                    <input type="text" id="customType" placeholder="Введите свой вид" maxlength="200" style="display:none; margin-top:8px;">
                </div>

                <div class="form-group">
                    <label>Афиша (jpg/png, до 2 МБ)</label>
                    <div class="poster-input-wrapper">
                        <input type="file" id="posterFile" accept="image/jpeg,image/png">
                    </div>
                    <img id="posterPreview" class="poster-preview" src="" style="display:none;" alt="Превью афиши">
                    <div class="poster-controls">
                        <button type="button" class="poster-upload-btn" onclick="uploadPoster()">Загрузить фото</button>
                        <button type="button" class="poster-delete-btn" onclick="clearPoster()">Удалить фото</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Описание программы</label>
                    <textarea id="description" maxlength="1000"></textarea>
                </div>

                <div class="form-group">
                    <label>Автор программы</label>
                    <input type="text" id="author" maxlength="200">
                </div>

                <div class="form-group">
                    <label>Ссылки на соцсети автора (по одной на строку)</label>
                    <textarea id="socialLinks" rows="3" maxlength="1000" placeholder="https://instagram.com/...&#10;https://t.me/..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Отмена</button>
                    <button type="button" class="copy-btn" onclick="copyProgram()">Копировать</button>
                    <button type="submit" class="save-btn">Сохранить</button>
                    <button type="button" id="deleteProgramBtn" class="delete-program-btn" onclick="deleteProgram()" style="display:none;">Удалить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let programsData = [];
        let currentEditId = null;
        let currentPosterFile = null;
        let existingPosterUrl = null;

        function toggleCategory(category) {
            const list = document.getElementById(`${category}List`);
            list.style.display = list.style.display === 'block' ? 'none' : 'block';
            if (category === 'programs' && list.style.display === 'block') {
                displayPrograms('programsList');
            } else if (category === 'archive' && list.style.display === 'block') {
                displayPrograms('archiveList');
            }
        }

        async function fetchPrograms() {
            try {
                const resp = await fetch('/next-show', { credentials: 'include' });
                if (!resp.ok) throw new Error('Ошибка загрузки');
                programsData = await resp.json();
                document.getElementById('programsCount').textContent = programsData.filter(isFutureProgram).length;
                displayPrograms('programsList');
                displayPrograms('archiveList');
            } catch (err) {
                console.error('Ошибка загрузки:', err);
            }
        }

        function isFutureProgram(program) {
            const now = new Date();
            const start = new Date(program.start_time);
            const end = new Date(start.getTime() + (program.duration_minutes || 0) * 60000);
            return end > now;
        }

        function getWeekStart(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = day === 0 ? -6 : 1 - day;
            const monday = new Date(d);
            monday.setDate(d.getDate() + diff);
            monday.setHours(6, 0, 0, 0);
            return monday;
        }

        function getDayKey(dateStr) {
            const d = new Date(dateStr);
            let dayKey = d.toISOString().split('T')[0];

            if (d.getHours() < 6) {
                const prev = new Date(d);
                prev.setDate(prev.getDate() - 1);
                dayKey = prev.toISOString().split('T')[0];
            }

            return dayKey;
        }

        function getDayName(dateStr) {
            const daysRu = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];
            const d = new Date(dateStr);
            let dayIndex = d.getDay();
            if (d.getHours() < 6) {
                dayIndex = (dayIndex - 1 + 7) % 7;
            }
            return daysRu[dayIndex];
        }

        function displayPrograms(listId) {
            const tbody = document.getElementById(listId === 'programsList' ? 'programsTableBody' : 'archiveTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const filtered = listId === 'programsList'
                ? programsData.filter(isFutureProgram)
                : programsData.filter(p => !isFutureProgram(p));

            filtered.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

            if (listId === 'programsList') {
                // Текущая неделя — всегда показываем разделители с понедельника
                const now = new Date();
                let currentMonday = getWeekStart(now);
                let weekEnd = new Date(currentMonday);
                weekEnd.setDate(currentMonday.getDate() + 7);
                weekEnd.setHours(5, 59, 59, 999);

                for (let i = 0; i < 7; i++) {
                    const dayDate = new Date(currentMonday);
                    dayDate.setDate(currentMonday.getDate() + i);
                    const dayKey = dayDate.toISOString().split('T')[0];
                    const dayName = getDayName(dayDate.toISOString());

                    // Разделитель
                    const separator = document.createElement('tr');
                    separator.className = 'day-separator';
                    separator.onclick = () => openAddModalWithDate(dayDate); // ← клик открывает модалку с датой дня
                    separator.innerHTML = `<td colspan="3">${dayName} — ${dayDate.toLocaleDateString('ru-RU')}</td>`;
                    tbody.appendChild(separator);

                    // Пустая строка после разделителя
                    const emptyRow = document.createElement('tr');
                    emptyRow.className = 'empty-row';
                    emptyRow.innerHTML = '<td colspan="3"></td>';
                    tbody.appendChild(emptyRow);

                    // Программы этого дня
                    const dayPrograms = filtered.filter(p => getDayKey(p.start_time) === dayKey);
                    dayPrograms.forEach(p => {
                        const row = document.createElement('tr');
                        row.className = 'program-row';
                        row.onclick = () => openEditModal(p);

                        const startStr = new Date(p.start_time).toLocaleString('ru-RU', {dateStyle: 'short', timeStyle: 'short'});

                        row.innerHTML = `
                            <td>${p.name || 'Без названия'}</td>
                            <td>${p.author || '—'}</td>
                            <td>${startStr}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }

                // Программы дальше недели — только с разделителями по дням
                const futurePrograms = filtered.filter(p => new Date(p.start_time) > weekEnd);

                if (futurePrograms.length > 0) {
                    let prevDayKey = null;

                    futurePrograms.forEach(p => {
                        const dayKey = getDayKey(p.start_time);

                        if (dayKey !== prevDayKey) {
                            const separator = document.createElement('tr');
                            separator.className = 'day-separator';
                            separator.innerHTML = `<td colspan="3">${getDayName(p.start_time)} — ${new Date(dayKey).toLocaleDateString('ru-RU')}</td>`;
                            tbody.appendChild(separator);

                            const emptyRow = document.createElement('tr');
                            emptyRow.className = 'empty-row';
                            emptyRow.innerHTML = '<td colspan="3"></td>';
                            tbody.appendChild(emptyRow);

                            prevDayKey = dayKey;
                        }

                        const row = document.createElement('tr');
                        row.className = 'program-row';
                        row.onclick = () => openEditModal(p);

                        const startStr = new Date(p.start_time).toLocaleString('ru-RU', {dateStyle: 'short', timeStyle: 'short'});

                        row.innerHTML = `
                            <td>${p.name || 'Без названия'}</td>
                            <td>${p.author || '—'}</td>
                            <td>${startStr}</td>
                        `;
                        tbody.appendChild(row);
                    });
                }
            } else {
                // Архив — обычные разделители только по дням с программами
                let prevDayKey = null;

                filtered.forEach(p => {
                    const dayKey = getDayKey(p.start_time);

                    if (dayKey !== prevDayKey) {
                        const separator = document.createElement('tr');
                        separator.className = 'day-separator';
                        separator.innerHTML = `<td colspan="3">${getDayName(p.start_time)} — ${new Date(dayKey).toLocaleDateString('ru-RU')}</td>`;
                        tbody.appendChild(separator);

                        const emptyRow = document.createElement('tr');
                        emptyRow.className = 'empty-row';
                        emptyRow.innerHTML = '<td colspan="3"></td>';
                        tbody.appendChild(emptyRow);

                        prevDayKey = dayKey;
                    }

                    const row = document.createElement('tr');
                    row.className = 'program-row';
                    row.onclick = () => openEditModal(p);

                    const startStr = new Date(p.start_time).toLocaleString('ru-RU', {dateStyle: 'short', timeStyle: 'short'});

                    row.innerHTML = `
                        <td>${p.name || 'Без названия'}</td>
                        <td>${p.author || '—'}</td>
                        <td>${startStr}</td>
                    `;
                    tbody.appendChild(row);
                });
            }

            if (!filtered.length && listId === 'archive') {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:40px; color:#777;">Архив пуст</td></tr>`;
            }
        }

        // Открытие модалки добавления с предустановленной датой дня
        function openAddModalWithDate(dayDate) {
            openAddModal();

            // Устанавливаем дату дня (18:00 по умолчанию)
            const year = dayDate.getFullYear();
            const month = String(dayDate.getMonth() + 1).padStart(2, '0');
            const day = String(dayDate.getDate()).padStart(2, '0');
            const defaultTime = `${year}-${month}-${day}T18:00`;
            document.getElementById('startDateTime').value = defaultTime;

            document.getElementById('modalTitle').textContent = 'Добавить программу на ' + dayDate.toLocaleDateString('ru-RU');
        }

        function openAddModal() {
            currentEditId = null;
            existingPosterUrl = null;
            document.getElementById('modalTitle').textContent = 'Добавить программу';
            document.getElementById('programForm').reset();
            document.getElementById('durationHours').value = '1';
            document.getElementById('durationMinutes').value = '0';
            document.getElementById('customType').style.display = 'none';
            document.getElementById('posterPreview').style.display = 'none';
            document.getElementById('modalPoster').style.display = 'none';
            document.getElementById('modalPosterPlaceholder').style.display = 'flex';
            currentPosterFile = null;
            document.getElementById('deleteProgramBtn').style.display = 'none';
            document.getElementById('programModal').style.display = 'flex';
        }

        function openEditModal(program) {
            currentEditId = program.id;
            existingPosterUrl = program.poster_url || null;
            document.getElementById('modalTitle').textContent = 'Редактировать программу';

            document.getElementById('eventName').value = program.name || '';
            document.getElementById('startDateTime').value = program.start_time?.slice(0,16) || '';

            const totalMin = program.duration_minutes || 60;
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            document.getElementById('durationHours').value = h;
            document.getElementById('durationMinutes').value = m;

            let type = program.program_type || 'podcast';
            document.getElementById('programType').value = type;
            document.getElementById('customType').value = type === 'custom' ? (program.custom_type || '') : '';
            toggleCustomType();

            document.getElementById('description').value = program.description || '';
            document.getElementById('author').value = program.author || '';
            document.getElementById('socialLinks').value = program.social_links || '';

            if (program.poster_url) {
                document.getElementById('modalPoster').src = program.poster_url + '?t=' + Date.now();
                document.getElementById('modalPoster').style.display = 'block';
                document.getElementById('modalPosterPlaceholder').style.display = 'none';
            } else {
                document.getElementById('modalPoster').style.display = 'none';
                document.getElementById('modalPosterPlaceholder').style.display = 'flex';
            }

            document.getElementById('posterPreview').style.display = 'none';
            currentPosterFile = null;

            document.getElementById('deleteProgramBtn').style.display = 'inline-block';
            document.getElementById('programModal').style.display = 'flex';
        }

        function toggleCustomType() {
            document.getElementById('customType').style.display = 
                document.getElementById('programType').value === 'custom' ? 'block' : 'none';
        }

        function uploadPoster() {
            const input = document.getElementById('posterFile');
            if (!input.files[0]) return console.warn('Выберите изображение');

            const file = input.files[0];
            if (file.size > 2 * 1024 * 1024) return console.warn('Максимум 2 МБ');
            if (!['image/jpeg','image/png'].includes(file.type)) return console.warn('Только JPG или PNG');

            const reader = new FileReader();
            reader.onload = e => {
                const previewUrl = e.target.result;
                document.getElementById('posterPreview').src = previewUrl;
                document.getElementById('posterPreview').style.display = 'block';
                document.getElementById('modalPoster').src = previewUrl;
                document.getElementById('modalPoster').style.display = 'block';
                document.getElementById('modalPosterPlaceholder').style.display = 'none';
                currentPosterFile = file;
            };
            reader.readAsDataURL(file);
        }

        function clearPoster() {
            if (!confirm('Удалить афишу?')) return;

            document.getElementById('posterFile').value = '';
            document.getElementById('posterPreview').style.display = 'none';
            document.getElementById('modalPoster').style.display = 'none';
            document.getElementById('modalPosterPlaceholder').style.display = 'flex';
            currentPosterFile = null;

            if (currentEditId) {
                fetch(`/next-show/${currentEditId}/clear_poster`, {
                    method: 'POST',
                    credentials: 'include'
                })
                .then(resp => {
                    if (resp.ok) console.log('Афиша очищена в базе');
                    else console.error('Ошибка очистки афиши');
                })
                .catch(err => console.error('Ошибка запроса:', err));
            }
        }

        document.getElementById('programForm').addEventListener('submit', async e => {
            e.preventDefault();

            const name = document.getElementById('eventName').value.trim();
            const author = document.getElementById('author').value.trim();
            const description = document.getElementById('description').value.trim();
            const customType = document.getElementById('customType').value.trim();
            const socialLinks = document.getElementById('socialLinks').value.trim();

            if (name.length > 200) {
                alert('Название события не может превышать 200 символов');
                return;
            }
            if (author.length > 200) {
                alert('Имя автора не может превышать 200 символов');
                return;
            }
            if (description.length > 1000) {
                alert('Описание не может превышать 1000 символов');
                return;
            }
            if (customType.length > 1000) {
                alert('Свой вариант не может превышать 1000 символов');
                return;
            }
            if (socialLinks.length > 1000) {
                alert('Ссылки не могут превышать 1000 символов');
                return;
            }

            const hours = parseInt(document.getElementById('durationHours').value) || 0;
            const minutes = parseInt(document.getElementById('durationMinutes').value) || 0;
            const durationMin = hours * 60 + minutes;

            if (durationMin < 10) {
                console.warn('Минимальная продолжительность — 10 минут');
                return;
            }

            const formData = new FormData();
            formData.append('name', name);
            formData.append('start_time', document.getElementById('startDateTime').value);
            formData.append('duration_minutes', durationMin);
            formData.append('program_type', document.getElementById('programType').value);
            formData.append('custom_type', document.getElementById('programType').value === 'custom' ? customType : '');
            formData.append('description', description);
            formData.append('author', author);
            formData.append('social_links', socialLinks);

            if (!currentPosterFile && existingPosterUrl) {
                formData.append('poster_url', existingPosterUrl);
            }

            if (currentPosterFile) {
                formData.append('poster', currentPosterFile);
            }

            console.log('Отправляем форму:', [...formData.entries()]);

            const url = currentEditId ? `/next-show/${currentEditId}` : '/next-show';
            const method = currentEditId ? 'PUT' : 'POST';

            try {
                const resp = await fetch(url, {
                    method,
                    body: formData,
                    credentials: 'include'
                });

                if (resp.ok) {
                    console.log(currentEditId ? 'Программа обновлена' : 'Программа добавлена');
                    closeModal();
                    fetchPrograms();
                } else {
                    const errText = await resp.text();
                    console.error('Ошибка сервера:', resp.status, errText);
                }
            } catch (err) {
                console.error('Ошибка сети:', err);
            }
        });

        async function deleteProgram() {
            if (!confirm('Удалить программу навсегда?')) return;

            try {
                const resp = await fetch(`/next-show/${currentEditId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                if (resp.ok) {
                    console.log('Программа удалена');
                    closeModal();
                    fetchPrograms();
                } else {
                    const errText = await resp.text();
                    console.error('Ошибка удаления:', resp.status, errText);
                }
            } catch (err) {
                console.error('Ошибка сети при удалении:', err);
            }
        }

        function copyProgram() {
            if (!currentEditId) {
                alert('Копировать можно только существующую программу');
                return;
            }

            const program = programsData.find(p => p.id === currentEditId);
            if (!program) return;

            openAddModal();

            document.getElementById('eventName').value = program.name || '';
            document.getElementById('durationHours').value = Math.floor(program.duration_minutes / 60) || 1;
            document.getElementById('durationMinutes').value = (program.duration_minutes % 60) || 0;

            let type = program.program_type || 'podcast';
            document.getElementById('programType').value = type;
            document.getElementById('customType').value = type === 'custom' ? (program.custom_type || '') : '';
            toggleCustomType();

            document.getElementById('description').value = program.description || '';
            document.getElementById('author').value = program.author || '';
            document.getElementById('socialLinks').value = program.social_links || '';

            if (program.poster_url) {
                document.getElementById('modalPoster').src = program.poster_url + '?t=' + Date.now();
                document.getElementById('modalPoster').style.display = 'block';
                document.getElementById('modalPosterPlaceholder').style.display = 'none';
                existingPosterUrl = program.poster_url;
            } else {
                document.getElementById('modalPoster').style.display = 'none';
                document.getElementById('modalPosterPlaceholder').style.display = 'flex';
                existingPosterUrl = null;
            }

            document.getElementById('deleteProgramBtn').style.display = 'none';
            document.getElementById('modalTitle').textContent = 'Добавить программу (скопировано)';
            console.log('Форма заполнена копией программы (без даты, афиша сохранена)');
        }

        function closeModal() {
            document.getElementById('programModal').style.display = 'none';
            currentEditId = null;
            currentPosterFile = null;
            existingPosterUrl = null;
        }

        fetchPrograms();
    </script>
</body>
</html>
