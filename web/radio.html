        body {
            background-color: black;

        .poster {

        }
        .play-stop-btn {

            background: #333;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;

        }
        .play-stop-btn:hover {
            background: #555;
        }
        .play-stop-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .play-stop-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        .schedule-section {
            width: 100%;
            max-width: 400px;
            margin: 30px auto 40px;

        }

            text-align: center;

        .schedule-table {

            border-collapse: collapse;
            background: transparent;
            overflow: hidden;

        .schedule-table th, .schedule-table td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid white;

        }
        .schedule-table th {

        .hamburger-menu {

            right: 30px;
            z-index: 1000;

        .hamburger-icon {

            width: 100%;

        .hamburger-icon.open span:nth-child(2) {

        .hamburger-icon.open span:nth-child(3) {

        }

        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 0;
            display: none;
        }
        .swipe-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1001;
            pointer-events: none;
            max-width: 200px;
            text-align: center;
        }
        .swipe-hint.show {
            opacity: 1;
        }

        /* === Модалка программы === */
        .program-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .program-modal.open {
            display: flex;
        }
        .program-modal-content {
            background: #1a1a1a;
            border-radius: 12px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .program-modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 28px;
            color: #aaa;
            cursor: pointer;
            line-height: 1;
        }
        .program-modal-close:hover {
            color: white;
        }
        .program-modal-poster {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .program-modal-title {
            font-size: 22px;
            margin: 0 0 8px 0;

        }
        .program-modal-meta {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 12px;
        }
        .program-modal-description {
            font-size: 15px;
            line-height: 1.5;
            color: #ddd;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        .program-modal-social {
            margin-top: 10px;
        }
        .program-modal-social a {
            color: #00aced;
            text-decoration: none;
            font-size: 15px;
        }
        .program-modal-social a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body { background-color: #1a1a1a; }
            .background-overlay { display: block; }
            .container {
                width: 100%;
                max-width: 320px;
                padding: 10px;
            }
            .logo { margin-bottom: 3px; }
            .equalizer { width: 100%; max-width: 200px; }
            .track-info { margin-bottom: 10px; }
            #track-artist { font-size: 16px; }
            #track-title { font-size: 14px; }
            #now-playing { font-size: 14px; }
            .poster-container {
                width: 320px;
                height: 320px;
            }
            .play-stop-btn {
                width: 70px;
                height: 35px;
            }
            .play-stop-btn svg {
                width: 20px;
                height: 20px;
            }
            .footer { 
                display: block; 
                background-color: rgba(0, 0, 0, 0.126) !important;
            }
            .hamburger-menu { display: block !important; }
            .menu-content.open { display: flex; }
            .program-modal-content {
                max-width: 100%;
                padding: 16px;
            }
        }
    </style>
</head>

    <audio id="player" style="display: none;" playsinline preload="auto"></audio>

    <script>
        const player = document.getElementById('player');
        
        const jinglePlayer = document.createElement('audio');
        jinglePlayer.id = 'jingle';
        jinglePlayer.src = '/jingle-start.mp3';
        jinglePlayer.preload = 'auto';
        jinglePlayer.playsinline = true;
        document.body.appendChild(jinglePlayer);

        const trackArtist = document.getElementById('track-artist');
        const trackTitle = document.getElementById('track-title');
        const trackPoster = document.getElementById('track-poster');
        const playStopBtn = document.getElementById('play-stop');
        const playIcon = document.getElementById('play-icon');
        const stopIcon = document.getElementById('stop-icon');
        const hamburgerIcon = document.getElementById('hamburger-icon');
        const menuContent = document.getElementById('menu-content');
        const swipeHint = document.getElementById('swipe-hint');
        const container = document.querySelector('.container');
        const posterContainer = document.querySelector('.poster-container');
        
        let isPlaying = false;
        let isJinglePlaying = false;
        let streamPreloaded = false;
        let isMenuOpen = false;

        let lastTrackData = {
            artist: "VTRNK",
            title: "Radio Show",
            coverPath: "/images/placeholder.png"
        };

        hamburgerIcon.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            hamburgerIcon.classList.toggle('open');
            menuContent.classList.toggle('open');
        });

        document.addEventListener('click', (e) => {
            if (!hamburgerIcon.contains(e.target) && !menuContent.contains(e.target)) {
                isMenuOpen = false;
                hamburgerIcon.classList.remove('open');
                menuContent.classList.remove('open');
            }
        });

        const canvas = document.getElementById('equalizer');
        const ctx = canvas.getContext('2d');
        canvas.width = 200;
        canvas.height = 40;
        const barCount = 14;
        const barWidth = (canvas.width / barCount) - 2;
        let bars = [];
        for (let i = 0; i < barCount; i++) {
            bars.push({ height: Math.random() * canvas.height, speed: Math.random() * 1.3 + 0.7 });
        }
        function drawEqualizer() {
            requestAnimationFrame(drawEqualizer);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let x = 0;
            for (let i = 0; i < barCount; i++) {
                let bar = bars[i];
                if (player.paused && !isJinglePlaying) bar.height = 5;
                else {
                    bar.height += bar.speed;
                    if (bar.height > canvas.height || bar.height < 0) bar.speed = -bar.speed;
                }
                ctx.fillStyle = '#d3d3d3';
                ctx.fillRect(x, canvas.height - bar.height, barWidth, bar.height);
                x += barWidth + 2;
            }
        }
        drawEqualizer();

        player.addEventListener('error', resetUI);
        player.addEventListener('play', () => {
            playIcon.style.display = 'none';
            stopIcon.style.display = 'block';
            isPlaying = true;
            isJinglePlaying = false;
            playStopBtn.disabled = false;
        });
        player.addEventListener('pause', resetUI);

        function resetUI() {
            playIcon.style.display = 'block';
            stopIcon.style.display = 'none';
            isPlaying = false;
            isJinglePlaying = false;
            playStopBtn.disabled = false;
        }

        function shouldPlayJingle() {
            const lastJingleTime = localStorage.getItem('lastJingleTime');
            if (!lastJingleTime) return true;
            const timeDiff = Date.now() - parseInt(lastJingleTime);
            return timeDiff > 10 * 60 * 1000;
        }

        function togglePlay() {
            playStopBtn.disabled = true;
            if (isPlaying) {
                player.pause();
                player.src = '';
                jinglePlayer.pause();
                resetUI();
                streamPreloaded = false;
                return;
            }
            if (!streamPreloaded) {
                const timestamp = Date.now();
                player.src = `/radio_stream?t=${timestamp}`;
                player.load();
                streamPreloaded = true;
            }

            if (shouldPlayJingle()) {
                isJinglePlaying = true;
                jinglePlayer.currentTime = 0;
                jinglePlayer.play().catch(() => startStream());
                localStorage.setItem('lastJingleTime', Date.now());
                jinglePlayer.addEventListener('ended', () => {
                    isJinglePlaying = false;
                    startStream();
                }, {once: true});
            } else {
                startStream();
            }
        }

        function startStream() {
            player.play().catch(resetUI);
        }

        playStopBtn.addEventListener('click', togglePlay);

        function updateBackgroundColor(imageSrc) {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.src = imageSrc;
            img.onload = () => {
                const colorThief = new ColorThief();
                const dominantColor = colorThief.getColor(img);
                document.body.style.backgroundColor = `rgb(${dominantColor[0]}, ${dominantColor[1]}, ${dominantColor[2]})`;
                document.querySelector('.background-overlay').style.display = 'block';
            };
        }

        function updateTrackUI(artist, title, coverPath) {
            trackArtist.textContent = artist || "VTRNK";
            trackTitle.textContent = title || "Radio Show";
            if (coverPath) {
                trackPoster.src = coverPath + '?t=' + Date.now();
                lastTrackData.coverPath = coverPath;
            }
            updateBackgroundColor(trackPoster.src);
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title || "Radio Show",
                    artist: artist || "VTRNK",
                    artwork: [{ src: trackPoster.src, sizes: '192x192', type: 'image/png' }]
                });
            }
        }

        window.addEventListener('resize', () => updateBackgroundColor(trackPoster.src));

        // === Модалка ===
        const programModal = document.getElementById('program-modal');
        const modalPoster = document.getElementById('modal-poster');
        const modalTitle = document.getElementById('modal-title');
        const modalMeta = document.getElementById('modal-meta');
        const modalDescription = document.getElementById('modal-description');
        const modalSocial = document.getElementById('modal-social');
        const modalClose = document.getElementById('program-modal-close');

        function openProgramModal(program) {
            modalTitle.textContent = program.name || 'Без названия';

            // Время + автор
            const date = new Date(program.start_time);
            const timeStr = date.toLocaleString('ru-RU', {
                weekday: 'short',
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });
            let meta = timeStr;
            if (program.author) meta += ' · ' + program.author;
            modalMeta.textContent = meta;

            // Описание
            if (program.description && program.description.trim()) {
                modalDescription.textContent = program.description;
                modalDescription.style.display = 'block';
            } else {
                modalDescription.style.display = 'none';
            }

            // Афиша
            if (program.poster_url) {
                modalPoster.src = program.poster_url;
                modalPoster.style.display = 'block';
            } else {
                modalPoster.style.display = 'none';
            }

            // Соц. ссылки
            if (program.social_links && program.social_links.trim()) {
                let link = program.social_links.trim();
                if (!link.startsWith('http')) link = 'https://' + link;
                modalSocial.innerHTML = `<a href="${link}" target="_blank" rel="noopener noreferrer">${program.social_links}</a>`;
                modalSocial.style.display = 'block';
            } else {
                modalSocial.style.display = 'none';
            }

            programModal.classList.add('open');
        }

        function closeProgramModal() {
            programModal.classList.remove('open');
        }

        modalClose.addEventListener('click', closeProgramModal);
        programModal.addEventListener('click', (e) => {
            if (e.target === programModal) closeProgramModal();
        });

        function programEnd(p) {
            const start = new Date(p.start_time);
            const mins = Number(p.duration_minutes) || 60;
            return new Date(start.getTime() + mins * 60000);
        }

        function radioDayKey(date) {
            const d = new Date(date);
            if (d.getHours() < 6) d.setDate(d.getDate() - 1);
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        async function loadSchedule() {
            try {
                const resp = await fetch('/next-show', { credentials: 'include' });
                if (!resp.ok) return;
                const programs = await resp.json();
                const tbody = document.getElementById('schedule-body');
                tbody.innerHTML = '';
                const now = new Date();
                const upcoming = programs
                    .filter(p => programEnd(p) > now)
                    .sort((a, b) => new Date(a.start_time) - new Date(b.start_time))
                    .slice(0, 15);
                let prevDay = null;
                upcoming.forEach(p => {
                    const date = new Date(p.start_time);
                    const dayKey = radioDayKey(date);
                    if (dayKey !== prevDay) {
                        const row = document.createElement('tr');
                        row.className = 'day-header';
                        row.innerHTML = `<td colspan="2">${date.toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'short'})}</td>`;
                        tbody.appendChild(row);
                        prevDay = dayKey;
                    }
                    const onAir = date <= now && programEnd(p) > now;
                    const row = document.createElement('tr');
                    row.className = 'program-row' + (onAir ? ' on-air' : '');
                    row.innerHTML = `
                        <td>${date.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})}</td>
                        <td>${p.name || '—'}${onAir ? '<span class="on-air-label">в эфире</span>' : ''}</td>
                    `;
                    row.addEventListener('click', () => openProgramModal(p));
                    tbody.appendChild(row);
                });
                if (!upcoming.length) {
                    tbody.innerHTML = `<tr><td colspan="2" style="text-align:center;padding:30px;color:#777;">Нет запланированных передач</td></tr>`;
                }
            } catch (e) {
                console.error('Ошибка расписания', e);
            }
        }

        window.addEventListener('load', () => {
            container.style.transform = 'translateX(0)';
            loadSchedule();
            setInterval(loadSchedule, 300000);
        });

        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                container.style.transform = 'translateX(0)';
            }
        });

        fetch('/track')
            .then(response => response.json())
            .then(data => {
                const dataDict = {};
                data.forEach(item => dataDict[item[0]] = item[1]);
                lastTrackData.artist = dataDict.artist || "VTRNK";
                lastTrackData.title = dataDict.title || "Radio Show";
                fetch('/get_cover_path')
                    .then(r => r.json())
                    .then(coverData => {
                        lastTrackData.coverPath = coverData.cover_path || "/images/placeholder.png";
                        updateTrackUI(lastTrackData.artist, lastTrackData.title, lastTrackData.coverPath);
                    })
                    .catch(() => updateTrackUI(lastTrackData.artist, lastTrackData.title, lastTrackData.coverPath));
            })
            .catch(() => updateTrackUI(lastTrackData.artist, lastTrackData.title, lastTrackData.coverPath));

        const socket = io('https://vtrnk.online');
        socket.on('track_update', (data) => {
            if (data.artist || data.title) {
                lastTrackData.artist = data.artist || lastTrackData.artist;
                lastTrackData.title = data.title || lastTrackData.title;
                fetch('/get_cover_path')
                    .then(r => r.json())
                    .then(coverData => {
                        lastTrackData.coverPath = coverData.cover_path || lastTrackData.coverPath;
                        updateTrackUI(lastTrackData.artist, lastTrackData.title, lastTrackData.coverPath);
                    })
                    .catch(() => updateTrackUI(lastTrackData.artist, lastTrackData.title, lastTrackData.coverPath));
            }
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', togglePlay);
            navigator.mediaSession.setActionHandler('pause', togglePlay);
        }

        let startX = 0;
        let startY = 0;
        let currentX = 0;
        let currentY = 0;
        let startTime = 0;
        const threshold = 100;
        const minHoldTime = 200;

        if (posterContainer) {
            posterContainer.addEventListener('touchstart', (e) => {
                const target = e.target;
                if (target.tagName === 'BUTTON' || target.closest('button')) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startTime = Date.now();
                currentX = startX;
                currentY = startY;
                swipeHint.textContent = 'Свайп для видео';
                swipeHint.classList.add('show');
                container.style.transition = 'none';
                container.style.transform = 'translateX(0px)';
            }, { passive: false });

            posterContainer.addEventListener('touchmove', (e) => {
                if (!startX || !startTime) return;
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
                const deltaX = currentX - startX;
                const deltaY = currentY - startY;
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    e.preventDefault();
                    container.style.transform = `translateX(${deltaX}px)`;
                    if (deltaX < -21) swipeHint.textContent = 'Переход к видео...';
                }
            }, { passive: false });

            posterContainer.addEventListener('touchend', (e) => {
                const deltaX = currentX - startX;
                const holdTime = Date.now() - startTime;
                swipeHint.classList.remove('show');
                container.style.transition = 'transform 0.3s ease-out';
                if (holdTime < minHoldTime || Math.abs(deltaX) < threshold) {
                    container.style.transform = 'translateX(0px)';
                } else if (deltaX < -threshold) {
                    container.style.transform = `translateX(-${window.innerWidth}px)`;
                    setTimeout(() => window.location.href = '/stream.html', 300);
                } else {
                    container.style.transform = 'translateX(0px)';
                }
                startX = startY = currentX = currentY = 0;
                startTime = 0;
            }, { passive: false });
        }
    </script>
</body>
</html>
