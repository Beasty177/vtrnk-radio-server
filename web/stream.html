        .container {

        .controls-row {
            position: relative;

            justify-content: center;

        .play-stop-btn {

        .play-stop-btn:hover {

        }
        .play-stop-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .play-stop-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        .quality-wrap {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            z-index: 2;
        }
        .quality-wrap.visible {
            display: block;
        }
        .quality-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 6px;
            background: transparent;;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .quality-btn:hover {
            background:  rgba(255, 255, 255, 0.12);
        }
        .quality-btn svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }
        .quality-menu {
            display: none;
            position: absolute;
            right: 0;
            bottom: 48px;
            min-width: 120px;
            background: rgba(20,20,20,0.95);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px 0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            z-index: 30;
        }
        .quality-menu.open {
            display: block;
        }
        .quality-menu button {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: none;
            color: #eee;
            padding: 8px 14px;
            font-size: 13px;
            cursor: pointer;
        }
        .quality-menu button:hover {
            background: #333;
        }
        .quality-menu button.active {
            color: #00aced;
        }
        .footer {
            text-align: center;
            padding: 13px;

            width: 100%;
            display: block;
        }
        .footer a {
            color: #00aced;
            text-decoration: none;
            font-size: 16px;
            margin: 0 10px;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .hamburger-menu {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: none;
        }
        .hamburger-icon {
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            background: none;
            border: none;
            padding: 5px;
        }
        .hamburger-icon span {
            width: 100%;
            height: 3px;
            background-color: white;
            transition: all 0.3s ease;
        }
        .hamburger-icon.open span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger-icon.open span:nth-child(2) {
            opacity: 0;
        }
        .hamburger-icon.open span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }
        .menu-content {
            position: fixed;
            top: 50px;
            right: 10px;
            background-color: #1a1a1a;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            padding: 10px;
            z-index: 999;
        }
        .menu-content a {
            color: #00aced;
            text-decoration: none;
            padding: 10px;
            font-size: 16px;
            text-align: right;
        }
        .menu-content a:hover {
            background-color: #333;
            border-radius: 3px;
        }
        .swipe-hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1001;
            pointer-events: none;
            max-width: 200px;
            text-align: center;
        }
        .swipe-hint.show {
            opacity: 1;
        }
        @media (max-width: 600px) {
            .container {
                width: 100%;
                max-width: 320px;
                overflow-x: hidden;
            }
            .logo {
                margin-bottom: 3px;
            }
            .equalizer {
                width: 100%;
                max-width: 200px;
            }
            .track-info {
                margin-bottom: 10px;
            }
            #track-artist { font-size: 16px; }
            #track-title { font-size: 14px; }
            #now-playing { font-size: 14px; }
            .poster-container {
                width: 320px;
                height: 320px;
            }
            .controls-row {
                width: 320px;
            }
            .play-stop-btn {
                width: 70px;
                height: 35px;
            }
            .play-stop-btn svg {
                width: 20px;
                height: 20px;
            }
            .quality-btn {
                width: 35px;
                height: 35px;
            }
            .footer {
                display: none;
            }
            .hamburger-menu {
                display: block;
            }
            .menu-content.open {
                display: flex;
            }
        }
    </style>
</head>

    <script>
        const videoPlayer = document.getElementById('video-player');
        const placeholderImg = document.getElementById('placeholder-img');
        const trackArtist = document.getElementById('track-artist');
        const trackTitle = document.getElementById('track-title');
        const playStopBtn = document.getElementById('play-stop');
        const playIcon = document.getElementById('play-icon');
        const stopIcon = document.getElementById('stop-icon');
        const hamburgerIcon = document.getElementById('hamburger-icon');
        const menuContent = document.getElementById('menu-content');
        const swipeHint = document.getElementById('swipe-hint');
        const container = document.querySelector('.container');
        const posterContainer = document.querySelector('.poster-container');
        const qualityWrap = document.getElementById('quality-wrap');
        const qualityBtn = document.getElementById('quality-btn');
        const qualityMenu = document.getElementById('quality-menu');
        let isPlaying = false;
        let isMenuOpen = false;
        let isVideoStreamActive = false;
        let previousStreamActive = false;
        let hls = null;
        let hlsFallbackUsed = false;
        let selectedLevel = -1;

        function levelLabel(level, index) {
            const byIndex = ['450', '750', '1080', 'Max'];
            return byIndex[index] || ('L' + index);
        }

        function rebuildQualityMenu() {
            qualityMenu.innerHTML = '';
            if (!hls || !hls.levels || hls.levels.length === 0) {
                qualityWrap.classList.remove('visible');
                return;
            }
            qualityWrap.classList.add('visible');

            const autoBtn = document.createElement('button');
            autoBtn.type = 'button';
            autoBtn.textContent = 'Авто';
            autoBtn.className = selectedLevel === -1 ? 'active' : '';
            autoBtn.addEventListener('click', () => {
                selectedLevel = -1;
                hls.currentLevel = -1;
                rebuildQualityMenu();
                qualityMenu.classList.remove('open');
            });
            qualityMenu.appendChild(autoBtn);

            hls.levels.forEach((level, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = levelLabel(level, index);
                btn.className = selectedLevel === index ? 'active' : '';
                btn.addEventListener('click', () => {
                    selectedLevel = index;
                    hls.currentLevel = index;
                    rebuildQualityMenu();
                    qualityMenu.classList.remove('open');
                });
                qualityMenu.appendChild(btn);
            });
        }

        qualityBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            qualityMenu.classList.toggle('open');
        });
        document.addEventListener('click', () => {
            qualityMenu.classList.remove('open');
        });

        hamburgerIcon.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            hamburgerIcon.classList.toggle('open');
            menuContent.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!hamburgerIcon.contains(e.target) && !menuContent.contains(e.target)) {
                isMenuOpen = false;
                hamburgerIcon.classList.remove('open');
                menuContent.classList.remove('open');
            }
        });

        const canvas = document.getElementById('equalizer');
        const ctx = canvas.getContext('2d');
        canvas.width = 200;
        canvas.height = 40;
        const barCount = 14;
        const barWidth = (canvas.width / barCount) - 2;
        let bars = [];
        for (let i = 0; i < barCount; i++) {
            bars.push({
                height: Math.random() * canvas.height,
                speed: Math.random() * 1.3 + 0.7
            });
        }
        function drawEqualizer() {
            requestAnimationFrame(drawEqualizer);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let x = 0;
            for (let i = 0; i < barCount; i++) {
                let bar = bars[i];
                if (!isPlaying || !isVideoStreamActive) {
                    bar.height = 5;
                } else {
                    bar.height += bar.speed;
                    if (bar.height > canvas.height || bar.height < 0) {
                        bar.speed = -bar.speed;
                    }
                }
                ctx.fillStyle = '#d3d3d3';
                ctx.fillRect(x, canvas.height - bar.height, barWidth, bar.height);
                x += barWidth + 2;
            }
        }
        drawEqualizer();

        videoPlayer.addEventListener('error', (e) => {
            console.error("Ошибка воспроизведения:", e);
            if (isVideoStreamActive) {
                isVideoStreamActive = false;
                if (isPlaying) updateVideoSource();
            } else {
                videoPlayer.pause();
                isPlaying = false;
                playIcon.style.display = 'block';
                stopIcon.style.display = 'none';
                videoPlayer.style.display = 'none';
                placeholderImg.style.display = 'block';
            }
        });

        videoPlayer.addEventListener('play', () => {
            playIcon.style.display = 'none';
            stopIcon.style.display = 'block';
            isPlaying = true;
            videoPlayer.style.display = 'block';
            placeholderImg.style.display = 'none';
        });

        videoPlayer.addEventListener('pause', () => {
            playIcon.style.display = 'block';
            stopIcon.style.display = 'none';
            isPlaying = false;
            videoPlayer.style.display = 'none';
            placeholderImg.style.display = 'block';
            qualityMenu.classList.remove('open');
        });

        async function checkStreamStatus() {
            try {
                const response = await fetch('/monitor/radio_status');
                const data = await response.json();
                isVideoStreamActive = data.video_stream_active;
                if (isVideoStreamActive !== previousStreamActive && isPlaying) {
                    updateVideoSource();
                    previousStreamActive = isVideoStreamActive;
                    updateTrackUI(null, null);
                }
            } catch (error) {
                console.error('Ошибка проверки видео-стрима:', error);
                isVideoStreamActive = false;
                if (isVideoStreamActive !== previousStreamActive && isPlaying) {
                    updateVideoSource();
                    previousStreamActive = isVideoStreamActive;
                    updateTrackUI(null, null);
                }
            }
        }

        function createHlsPlayer(sourceUrl) {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            hls = new Hls({
                liveSyncDurationCount: 3,
                liveMaxLatencyDurationCount: Infinity,
                liveDurationInfinity: true,
                lowLatencyMode: true,
                maxBufferLength: 60,
                enableWorker: false
            });
            hls.loadSource(sourceUrl);
            hls.attachMedia(videoPlayer);
            hls.on('hlsManifestParsed', function () {
                if (selectedLevel >= 0 && selectedLevel < hls.levels.length) {
                    hls.currentLevel = selectedLevel;
                } else {
                    hls.currentLevel = -1;
                    selectedLevel = -1;
                }
                rebuildQualityMenu();
                videoPlayer.play().catch(err => {
                    if (err && err.name === 'AbortError') {
                        console.log('play() interrupted (normal race), ignore');
                        return;
                    }
                    console.error("Ошибка воспроизведения стрима:", err);
                    videoPlayer.pause();
                    isPlaying = false;
                    playIcon.style.display = 'block';
                    stopIcon.style.display = 'none';
                    videoPlayer.style.display = 'none';
                    placeholderImg.style.display = 'block';
                });
            });
            hls.on('hlsError', function (event, data) {
                if (!data.fatal) return;
                if (!hlsFallbackUsed && sourceUrl.indexOf('video_stream123.m3u8') === -1) {
                    hlsFallbackUsed = true;
                    createHlsPlayer('/hls/video_stream123.m3u8');
                    return;
                }
                isVideoStreamActive = false;
                qualityWrap.classList.remove('visible');
                updateVideoSource();
            });
        }

        function updateVideoSource() {
            if (!isPlaying) {
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                hlsFallbackUsed = false;
                qualityWrap.classList.remove('visible');
                videoPlayer.src = '';
                videoPlayer.style.display = 'none';
                placeholderImg.style.display = 'block';
                return;
            }

            if (isVideoStreamActive && Hls.isSupported()) {
                hlsFallbackUsed = false;
                createHlsPlayer('/hls/master.m3u8');
                videoPlayer.removeAttribute('loop');
            } else if (isVideoStreamActive && videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                qualityWrap.classList.remove('visible');
                videoPlayer.src = '/hls/master.m3u8';
                videoPlayer.removeAttribute('loop');
                videoPlayer.play().catch(err => {
                    if (err && err.name === 'AbortError') {
                        console.log('play() interrupted (normal race), ignore');
                        return;
                    }
                    videoPlayer.src = '/hls/video_stream123.m3u8';
                    videoPlayer.play().catch(err2 => {
                        if (err2 && err2.name === 'AbortError') {
                            console.log('play() interrupted (normal race), ignore');
                            return;
                        }
                        videoPlayer.pause();
                        isPlaying = false;
                        playIcon.style.display = 'block';
                        stopIcon.style.display = 'none';
                        videoPlayer.style.display = 'none';
                        placeholderImg.style.display = 'block';
                    });
                });
            } else {
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                hlsFallbackUsed = false;
                qualityWrap.classList.remove('visible');
                videoPlayer.src = '/images/vplace.MP4';
                videoPlayer.setAttribute('loop', 'true');
                videoPlayer.load();
                videoPlayer.play().catch(err => {
                    if (err && err.name === 'AbortError') {
                        console.log('play() interrupted (normal race), ignore');
                        return;
                    }
                    videoPlayer.pause();
                    isPlaying = false;
                    playIcon.style.display = 'block';
                    stopIcon.style.display = 'none';
                    videoPlayer.style.display = 'none';
                    placeholderImg.style.display = 'block';
                });
            }
            videoPlayer.style.display = 'block';
            placeholderImg.style.display = 'none';
        }

        function togglePlay() {
            if (isPlaying) {
                videoPlayer.pause();
            } else {
                isPlaying = true;
                playIcon.style.display = 'none';
                stopIcon.style.display = 'block';
                updateVideoSource();
            }
        }

        playStopBtn.addEventListener('click', togglePlay);

        function updateTrackUI(artist, title) {
            if (isVideoStreamActive) {
                trackArtist.textContent = "VTRNK";
                trackTitle.textContent = "Video Stream";
            } else {
                trackArtist.textContent = artist || "VTRNK";
                trackTitle.textContent = title || "Video Stream";
            }
        }

        async function initialize() {
            await checkStreamStatus();
            fetch('/track')
                .then(response => response.json())
                .then(data => {
                    const dataDict = {};
                    data.forEach(item => {
                        dataDict[item[0]] = item[1];
                    });
                    updateTrackUI(dataDict.artist, dataDict.title);
                })
                .catch(() => updateTrackUI("VTRNK", "Video Stream"));
            videoPlayer.style.display = 'none';
            placeholderImg.style.display = 'block';
        }

        initialize();
        setInterval(checkStreamStatus, 10000);

        const socket = io('https://vtrnk.online');
        socket.on('track_update', (data) => {
            if (!isVideoStreamActive) {
                updateTrackUI(data.artist, data.title);
            }
        });

        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', togglePlay);
            navigator.mediaSession.setActionHandler('pause', togglePlay);
        }

        let startX = 0, startY = 0, currentX = 0, currentY = 0, startTime = 0;
        const threshold = 70;
        const minHoldTime = 200;
        const isMobile = window.innerWidth <= 600;

        if (isMobile && posterContainer) {
            posterContainer.addEventListener('touchstart', (e) => {
                const target = e.target;
                if (target.tagName === 'BUTTON' || target.closest('button') || target.tagName === 'INPUT') return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                startTime = Date.now();
                currentX = startX;
                currentY = startY;
                swipeHint.textContent = 'Свайп вправо для радио';
                swipeHint.classList.add('show');
                container.style.transition = 'none';
                container.style.transform = 'translateX(0px)';
            }, { passive: false });

            posterContainer.addEventListener('touchmove', (e) => {
                if (!startX || !startTime) return;
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
                const deltaX = currentX - startX;
                const deltaY = currentY - startY;
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    e.preventDefault();
                    container.style.transform = `translateX(${deltaX}px)`;
                    if (deltaX > 21) swipeHint.textContent = 'Переход к радио...';
                    else if (deltaX < -21) swipeHint.textContent = 'Свайп влево для видео (или используйте меню)';
                }
            }, { passive: false });

            posterContainer.addEventListener('touchend', () => {
                const deltaX = currentX - startX;
                const holdTime = Date.now() - startTime;
                swipeHint.classList.remove('show');
                container.style.transition = 'transform 0.3s ease-out';
                if (holdTime < minHoldTime || Math.abs(deltaX) < threshold) {
                    container.style.transform = 'translateX(0px)';
                } else if (deltaX > threshold) {
                    container.style.transform = `translateX(${window.innerWidth}px)`;
                    setTimeout(() => { window.location.href = '/radio.html'; }, 300);
                } else {
                    container.style.transform = 'translateX(0px)';
                }
                startX = startY = currentX = currentY = 0;
                startTime = 0;
            }, { passive: false });
        }
    </script>
</body>
</html>
