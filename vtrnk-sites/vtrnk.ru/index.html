<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTRNK Radio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="images/logovtrnk.png" alt="VTRNK Radio Logo" class="logo">
        </div>
        <h1>VTRNK Radio</h1>
        <p>internet radio stream 24/7</p>
        <p>Burn Babylon • vtrnk.online</p>
        
        <button id="playButton" class="play-button">PLAY</button>

        <!-- Ссылка на приложение -->
        <div class="app-footer">
            <a href="https://play.google.com/store/apps/details?id=com.vtrnk.radio&pcampaignid=web_share" 
               target="_blank" 
               rel="noopener noreferrer"
               class="app-link">
                
                <img src="images/googleplay-badge-01-getit.width-1440.png" 
                     alt="Get it on Google Play" 
                     class="google-play-badge">
                
                <p>Listen on the go — download our app!</p>
            </a>
        </div>
    </div>

    <audio id="radioStream" preload="auto" playsinline></audio>

    <script src="script.js"></script>
</body>
</html>
